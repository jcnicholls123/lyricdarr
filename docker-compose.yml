services:
  lyricdarr:
    image: ghcr.io/jcnicholls123/lyricdarr:latest
    container_name: lyricdarr
    restart: unless-stopped
    ports:
      - "8787:8686"
    environment:
      - MUSIC_DIR=/music
      - SCAN_INTERVAL_HOURS=6
      - PUID=1000
      - PGID=1000
    volumes:
      # Same music library path Lidarr/Plex use, read-write,
      # since Lyricdarr writes .lrc files next to each track.
      - /mnt/Media/PLEXMedia/Music:/music
      # Persistent app config/database (mirrors how Sonarr/Radarr/Bazarr store /config)
      - /mnt/Apps/arrs/lyrics:/config
