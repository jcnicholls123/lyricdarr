<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyricdarr</title>
<style>
  :root {
    /* Warm, analog "tape deck" palette — vinyl-sleeve brown-black, paper-cream
       text, and a single signal-red accent standing in for a VU meter's peak
       light. Chosen over a cooler dark-navy/gold scheme to feel like hardware
       for handling physical media, not a generic admin theme. */
    --ink: #17130f;
    --ink-raised: #221c15;
    --ink-line: #3a2f22;
    --gold: #e2542d;
    --gold-dim: #8f3b22;
    --text: #f2e8d5;
    --text-dim: #9c8d78;
    --green: #6fae7a;
    --red: #c2665a;
    --blue: #7c93ab;
    --mono: Consolas, "Cascadia Code", "SFMono-Regular", Menlo, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 28px 36px 20px;
    border-bottom: 1px solid var(--ink-line);
  }
  .brand-group { display: flex; align-items: baseline; gap: 14px; }
  .brand {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .brand-accent { color: var(--gold); }
  .brand-mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--gold);
    border-radius: 50%;
    margin-right: 10px;
    box-shadow: 0 0 6px 1px rgba(226, 84, 45, 0.55);
    animation: breathe 3s ease-in-out infinite;
  }
  .tagline {
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono);
  }
  .tagline .tag-key { color: var(--gold); margin-right: 6px; }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--ink-line);
    color: var(--text-dim);
    width: 34px;
    height: 34px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { color: var(--gold); border-color: var(--gold-dim); }

  main { padding: 28px 36px 60px; max-width: 1100px; margin: 0 auto; }

  /* The library rendered as if it were one big .lrc file's tag header —
     the signature element: real LRC files open with bracket metadata tags
     ([ar:], [ti:], [length:]) before the timed lyric lines, so the stats
     block borrows that exact syntax instead of a generic stat-card grid. */
  .tagblock {
    background: var(--ink-raised);
    border: 1px solid var(--ink-line);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 20px;
    font-family: var(--mono);
  }
  .tagblock-head {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }
  .tagblock-head .cursor { color: var(--gold); margin-left: 2px; animation: blink 1s steps(1) infinite; }
  .tagblock-row { display: flex; flex-wrap: wrap; gap: 20px 32px; }
  .tk { display: flex; align-items: baseline; gap: 8px; }
  .tk-key { font-size: 12px; color: var(--text-dim); }
  .tk-val { font-size: 22px; font-weight: 700; color: var(--text); }
  .tk.found .tk-val { color: var(--green); }
  .tk.missing .tk-val { color: var(--gold); }
  .tk.inst .tk-val { color: var(--text-dim); }

  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color: #1a1508;
    border: 1px solid rgba(0, 0, 0, 0.35);
    padding: 10px 18px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 1px 2px rgba(0, 0, 0, 0.35);
    transition: opacity 0.15s ease, transform 0.08s ease, box-shadow 0.08s ease;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: translateY(1px); box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.4); }
  button:disabled { opacity: 0.4; cursor: wait; }
  button.secondary {
    background: var(--ink-raised);
    border: 1px solid var(--ink-line);
    color: var(--text);
    box-shadow: none;
  }
  button.secondary:active { box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.3); }
  button.danger {
    background: var(--ink-raised);
    border: 1px solid var(--red);
    color: var(--red);
    box-shadow: none;
  }
  button.danger:hover { background: var(--red); color: var(--ink); opacity: 1; }
  #scan-btn::before { content: '\21BB\A0'; }
  #verify-btn::before { content: '\2713\A0'; }
  #fetch-btn::before { content: '\2193\A0'; }
  .retry-btn::before { content: '\21BB\A0'; }

  .progress-wrap {
    margin-bottom: 24px;
    min-height: 18px;
  }
  .progress-msg {
    color: var(--text-dim);
    font-size: 13px;
    font-family: var(--mono);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress-msg.ok { color: var(--green); }
  .progress-msg.err { color: var(--red); }
  .progress-msg.running::after {
    content: '\2595';
    margin-left: 4px;
    color: var(--gold);
    animation: blink 1s steps(1) infinite;
  }
  /* Tape-counter styling: a row of ticks rather than a smooth gradient bar. */
  .progress-bar-track {
    display: none;
    height: 8px;
    border-radius: 2px;
    background-color: var(--ink-line);
    background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.35) 0 2px, transparent 2px 6px);
    overflow: hidden;
  }
  .progress-bar-track.active { display: block; }
  .progress-bar-fill {
    height: 100%;
    background-color: var(--gold);
    background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.25) 0 2px, transparent 2px 6px);
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-bar-fill.indeterminate {
    width: 30% !important;
    animation: indeterminate 1.2s ease-in-out infinite;
  }
  @keyframes indeterminate {
    0% { margin-left: -30%; }
    100% { margin-left: 100%; }
  }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Styled like buttons on a mixing console rather than underlined web tabs —
     the active view sits flush and inset, like it's been pressed in. */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--ink-line);
  }
  .tab {
    background: var(--ink-raised);
    border: 1px solid var(--ink-line);
    border-bottom: none;
    color: var(--text-dim);
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    border-radius: 4px 4px 0 0;
    transform: translateY(1px);
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--gold);
    background: var(--ink);
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.35);
    transform: translateY(0);
  }

  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, input[type=text], input[type=number] {
    background: var(--ink-raised);
    border: 1px solid var(--ink-line);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 5px;
    font-size: 13px;
  }
  input[type=text] { flex: 1; min-width: 200px; }

  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 10px 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--ink-line);
    white-space: nowrap;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--ink-line);
  }
  tr:hover td { background: var(--ink-raised); }
  /* A status badge rendered as a literal bracket tag — [found], [pending] — the
     same syntax as the real metadata tags an .lrc file carries, rather than a
     generic colored pill. */
  .badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge::before { content: '['; }
  .badge::after { content: ']'; }
  .badge.found, .badge.found_unsynced { color: var(--green); }
  .badge.pending { color: var(--blue); }
  .badge.not_found, .badge.error { color: var(--red); }
  .badge.instrumental { color: var(--text-dim); }
  /* A fuzzy-matched candidate awaiting approval - same "peak light" gold as
     the header accent, since it's a "worth a look", not an error. */
  .badge.pending_review { color: var(--gold); }
  .retry-btn {
    background: none;
    border: 1px solid var(--ink-line);
    color: var(--text-dim);
    padding: 4px 10px;
    font-size: 11px;
  }
  .delete-btn {
    background: none;
    border: 1px solid var(--ink-line);
    color: var(--text-dim);
    width: 24px;
    height: 24px;
    line-height: 1;
    padding: 0;
    font-size: 17px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .delete-btn:hover { color: var(--red); border-color: var(--red); opacity: 1; }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 18px;
  }
  .pagination button {
    background: var(--ink-raised);
    border: 1px solid var(--ink-line);
    color: var(--text);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .pagination button.active { background: var(--gold); color: #1a1508; border-color: var(--gold); }
  .pagination button:disabled { opacity: 0.35; cursor: default; }
  .pagination .page-info {
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono);
    margin: 0 8px;
  }

  /* Tree browser (artist / album grouping) */
  .tree-list { display: flex; flex-direction: column; gap: 4px; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 5px;
    cursor: pointer;
    background: var(--ink-raised);
    border: 1px solid var(--ink-line);
  }
  .tree-row:hover { border-color: var(--gold-dim); }
  .tree-row.expanded { box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3); }
  .tree-row .chevron {
    width: 12px;
    color: var(--text-dim);
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .tree-row.expanded .chevron { transform: rotate(90deg); }
  .tree-row .name { flex: 1; font-size: 14px; }
  .tree-row .sub-name { color: var(--text-dim); font-size: 12px; margin-left: 6px; }
  .tree-row .tick { font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .tree-row .tick.complete { color: var(--green); }
  .tree-row .tick.partial { color: var(--text-dim); font-family: var(--mono); }
  .tree-children {
    display: none;
    margin: 4px 0 4px 26px;
    flex-direction: column;
    gap: 3px;
  }
  .tree-children.open { display: flex; }
  .album-block { display: flex; flex-direction: column; gap: 3px; }
  .track-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--ink-line);
  }
  .track-row .name { flex: 1; color: var(--text); }
  .track-row .retry-btn { margin-left: auto; }

  /* Settings modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--ink-raised);
    border: 1px solid var(--ink-line);
    border-radius: 8px;
    padding: 24px;
    width: 380px;
    max-width: 90vw;
  }
  .modal h2 {
    margin: 0 0 18px;
    font-family: var(--mono);
    color: var(--gold);
    font-size: 16px;
    letter-spacing: 0.03em;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .field input[type=text], .field input[type=number] { width: 100%; }
  .field.checkbox { display: flex; align-items: center; gap: 10px; }
  .field.checkbox label { margin: 0; text-transform: none; font-size: 13px; color: var(--text); }
  /* A physical-looking toggle switch instead of a native checkbox — fits the
     hardware-panel language used for the rest of the settings dialog. */
  .field.checkbox input[type=checkbox] {
    appearance: none;
    -webkit-appearance: none;
    width: 38px;
    height: 22px;
    flex-shrink: 0;
    background: var(--ink-line);
    border: 1px solid rgba(0, 0, 0, 0.35);
    border-radius: 11px;
    position: relative;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .field.checkbox input[type=checkbox]::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .field.checkbox input[type=checkbox]:checked { background: var(--green); }
  .field.checkbox input[type=checkbox]:checked::after { transform: translateX(16px); background: var(--ink); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* Lyrics review modal */
  .preview-modal { width: 560px; }
  .preview-lyrics {
    margin: 0;
    max-height: 50vh;
    overflow-y: auto;
    background: var(--ink);
    border: 1px solid var(--ink-line);
    border-radius: 4px;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .review-btn {
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 4px 10px;
    font-size: 11px;
  }
  .review-btn:hover { background: var(--gold); color: var(--ink); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .brand-mark, .tagblock-head .cursor, .progress-msg.running::after, .progress-bar-fill.indeterminate {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand-group">
    <div class="brand"><span class="brand-mark"></span>Lyric<span class="brand-accent">darr</span></div>
    <div class="tagline"><span class="tag-key">[about]</span>synced lyrics, found and filed for your library</div>
  </div>
  <button class="icon-btn" onclick="openSettings()" title="Settings">&#9881;</button>
</header>

<main>
  <div class="tagblock" id="stats"></div>

  <div class="actions">
    <button id="scan-btn" onclick="startJob('/api/scan/start')" title="Rescans your music folder: adds new tracks and removes any whose file has been deleted">Refresh library</button>
    <button id="verify-btn" class="secondary" onclick="startJob('/api/verify/start')">Verify LRC files</button>
    <button id="fetch-btn" onclick="startJob('/api/fetch/start')">Download missing lyrics</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-msg" id="progress-msg"></div>
    <div class="progress-bar-track" id="progress-track">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-group="artist" onclick="setGroupBy('artist')">Artists</button>
    <button class="tab" data-group="album" onclick="setGroupBy('album')">Albums</button>
    <button class="tab" data-group="song" onclick="setGroupBy('song')">Songs</button>
  </div>

  <div class="filters">
    <select id="status-filter" onchange="onFilterChange()">
      <option value="">All statuses</option>
      <option value="pending">Pending</option>
      <option value="found">Found (synced)</option>
      <option value="found_unsynced">Found (unsynced)</option>
      <option value="not_found">Not found</option>
      <option value="instrumental">Instrumental</option>
      <option value="error">Error</option>
      <option value="pending_review">Needs review (fuzzy matched)</option>
    </select>
    <input type="text" id="search-box" placeholder="Search artist, title, album..." onkeyup="debouncedLoad()">
  </div>

  <div id="library-container"></div>
  <div class="empty-state" id="empty-state" style="display:none">Nothing scanned yet — click "Refresh library" to find your tracks.</div>
  <div class="pagination" id="pagination" style="display:none"></div>
</main>

<div class="modal-overlay" id="settings-overlay">
  <div class="modal">
    <h2>[settings]</h2>
    <div class="field">
      <label>Music directory (read-only, set via volume mount)</label>
      <input type="text" id="settings-music-dir" disabled>
    </div>
    <div class="field">
      <label>Auto-scan interval (hours)</label>
      <input type="number" id="settings-interval" min="0.5" step="0.5">
    </div>
    <div class="field checkbox">
      <input type="checkbox" id="settings-auto-scan">
      <label for="settings-auto-scan">Enable automatic scan + fetch on a schedule</label>
    </div>
    <div class="field checkbox">
      <input type="checkbox" id="settings-netease">
      <label for="settings-netease">Use NetEase Cloud Music as a fallback when LRCLIB has no match</label>
    </div>
    <div class="field" id="settings-webhook-hint" style="margin-bottom:0"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeSettings()">Cancel</button>
      <button onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="preview-overlay">
  <div class="modal preview-modal">
    <h2>[review lyrics]</h2>
    <div class="field" style="margin-bottom:10px">
      <div id="preview-title" style="color:var(--text);font-size:14px"></div>
      <div id="preview-source" style="color:var(--text-dim);font-size:12px;margin-top:2px"></div>
    </div>
    <pre id="preview-lyrics" class="preview-lyrics"></pre>
    <div class="modal-actions">
      <button class="secondary" onclick="closePreview()">Close</button>
      <button class="danger" onclick="rejectPending()">Reject</button>
      <button onclick="approvePending()">Approve &amp; save</button>
    </div>
  </div>
</div>

<script>
let debounceTimer;
let groupBy = 'artist';
let currentPage = 1;
const pageSize = 100;
const expanded = new Set();
let jobRunning = false;

function debouncedLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { currentPage = 1; loadLibrary(); }, 300);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

// --- Stats ---

async function loadStats() {
  const res = await fetch('/api/status');
  const data = await res.json();
  const found = (data.by_status.found || 0) + (data.by_status.found_unsynced || 0);
  const missing = data.total_tracks - found - (data.by_status.instrumental || 0);
  const instrumental = data.by_status.instrumental || 0;
  const needsReview = data.needs_review || 0;
  const fmt = n => n.toLocaleString();
  document.getElementById('stats').innerHTML = `
    <div class="tagblock-head">[library.lrc]<span class="cursor">&#9615;</span></div>
    <div class="tagblock-row">
      <span class="tk total"><span class="tk-key">[total]</span> <span class="tk-val">${fmt(data.total_tracks)}</span></span>
      <span class="tk found"><span class="tk-key">[found]</span> <span class="tk-val">${fmt(found)}</span></span>
      <span class="tk missing"><span class="tk-key">[missing]</span> <span class="tk-val">${fmt(missing)}</span></span>
      <span class="tk inst"><span class="tk-key">[instrumental]</span> <span class="tk-val">${fmt(instrumental)}</span></span>
      ${needsReview ? `<span class="tk review" style="cursor:pointer" onclick="jumpToReview()" title="Fuzzy-matched lyrics — click to review"><span class="tk-key" style="color:var(--gold)">[review]</span> <span class="tk-val" style="color:var(--gold)">${fmt(needsReview)}</span></span>` : ''}
    </div>
  `;
}

// --- Group-by tabs ---

function setGroupBy(mode) {
  groupBy = mode;
  currentPage = 1;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.group === mode));
  document.getElementById('status-filter').style.display = mode === 'song' ? '' : 'none';
  loadLibrary();
}

function onFilterChange() {
  currentPage = 1;
  loadLibrary();
}

function jumpToReview() {
  groupBy = 'song';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.group === 'song'));
  document.getElementById('status-filter').style.display = '';
  document.getElementById('status-filter').value = 'pending_review';
  currentPage = 1;
  loadLibrary();
}

// --- Library loading ---

async function loadLibrary() {
  if (groupBy === 'song') {
    await loadSongsPage();
  } else {
    await loadTree();
  }
}

async function loadTree() {
  const search = document.getElementById('search-box').value;
  const params = new URLSearchParams({ group_by: groupBy });
  if (search) params.set('search', search);
  const res = await fetch('/api/library/tree?' + params.toString());
  const data = await res.json();

  document.getElementById('pagination').style.display = 'none';

  const container = document.getElementById('library-container');
  const emptyState = document.getElementById('empty-state');

  if (groupBy === 'artist') {
    if (!data.artists.length) { container.innerHTML = ''; emptyState.style.display = 'block'; return; }
    emptyState.style.display = 'none';
    container.innerHTML = `<div class="tree-list">${data.artists.map(renderArtist).join('')}</div>`;
  } else {
    if (!data.albums.length) { container.innerHTML = ''; emptyState.style.display = 'block'; return; }
    emptyState.style.display = 'none';
    container.innerHTML = `<div class="tree-list">${data.albums.map(renderAlbumFlat).join('')}</div>`;
  }
}

function tickHtml(satisfied, total) {
  if (satisfied === total) return `<span class="tick complete">&#10003;</span>`;
  return `<span class="tick partial">${satisfied}/${total}</span>`;
}

function renderArtist(artist) {
  const key = 'a:' + artist.name;
  const isOpen = expanded.has(key);
  return `
    <div>
      <div class="tree-row ${isOpen ? 'expanded' : ''}" onclick="toggleExpand('${escapeAttr(key)}')">
        <span class="chevron">&#9656;</span>
        <span class="name">${escapeHtml(artist.name)}<span class="sub-name">${artist.albums.length} album${artist.albums.length === 1 ? '' : 's'}</span></span>
        ${tickHtml(artist.satisfied_count, artist.track_count)}
        <button class="delete-btn" onclick="deleteArtist('${escapeAttr(artist.name)}', event)" title="Remove this artist from Lyricdarr">&#9167;</button>
      </div>
      <div class="tree-children ${isOpen ? 'open' : ''}" id="children-${cssKey(key)}">
        ${artist.albums.map(a => renderAlbumNested(a, artist.name)).join('')}
      </div>
    </div>
  `;
}

function renderAlbumNested(album, artistName) {
  const key = 'al:' + artistName + '::' + album.name;
  const isOpen = expanded.has(key);
  return `
    <div class="album-block">
      <div class="tree-row ${isOpen ? 'expanded' : ''}" onclick="toggleExpand('${escapeAttr(key)}')">
        <span class="chevron">&#9656;</span>
        <span class="name">${escapeHtml(album.name)}</span>
        ${tickHtml(album.satisfied_count, album.track_count)}
        <button class="delete-btn" onclick="deleteAlbum('${escapeAttr(artistName)}', '${escapeAttr(album.name)}', event)" title="Remove this album from Lyricdarr">&#9167;</button>
      </div>
      <div class="tree-children ${isOpen ? 'open' : ''}" id="children-${cssKey(key)}">
        ${album.tracks.map(renderTrackRow).join('')}
      </div>
    </div>
  `;
}

function renderAlbumFlat(album) {
  const key = 'alf:' + album.artist + '::' + album.name;
  const isOpen = expanded.has(key);
  return `
    <div>
      <div class="tree-row ${isOpen ? 'expanded' : ''}" onclick="toggleExpand('${escapeAttr(key)}')">
        <span class="chevron">&#9656;</span>
        <span class="name">${escapeHtml(album.name)}<span class="sub-name">${escapeHtml(album.artist)}</span></span>
        ${tickHtml(album.satisfied_count, album.track_count)}
        <button class="delete-btn" onclick="deleteAlbum('${escapeAttr(album.artist)}', '${escapeAttr(album.name)}', event)" title="Remove this album from Lyricdarr">&#9167;</button>
      </div>
      <div class="tree-children ${isOpen ? 'open' : ''}" id="children-${cssKey(key)}">
        ${album.tracks.map(renderTrackRow).join('')}
      </div>
    </div>
  `;
}

// Tracks are re-rendered from fresh API responses on every load, so caching
// each one by id here (as a render side-effect) is enough to let the preview
// modal read pending lyrics text without a dedicated fetch-by-id endpoint.
const trackCache = {};

function cacheTrack(t) {
  trackCache[t.id] = t;
  return t;
}

function actionButtonsHtml(t) {
  if (t.status === 'pending_review') {
    return `<button class="review-btn" onclick="openPreview(${t.id}, event)">Review</button>`;
  }
  if (t.status !== 'found') {
    return `<button class="retry-btn" onclick="retryTrack(${t.id}, event)">Retry</button>`;
  }
  return '';
}

function renderTrackRow(t) {
  cacheTrack(t);
  return `
    <div class="track-row">
      <span class="name">${escapeHtml(t.title)}</span>
      <span class="badge ${t.status}">${t.status.replace('_', ' ')}</span>
      ${actionButtonsHtml(t)}
      <button class="delete-btn" onclick="deleteTrack(${t.id}, event)" title="Remove this track from Lyricdarr">&#9167;</button>
    </div>
  `;
}

function cssKey(key) { return key.replace(/[^a-zA-Z0-9]/g, '_'); }

// Safe to interpolate into a single-quoted JS string inside a double-quoted
// HTML attribute (e.g. onclick="fn('${escapeAttr(x)}')") — escapes JS string
// metacharacters first, then HTML-escapes so the value can't break out of the
// attribute itself (a raw double quote here would otherwise let arbitrary
// attributes/handlers be injected via crafted artist/album/title tags).
function escapeAttr(str) {
  return String(str)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\n/g, '\\n')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function toggleExpand(key) {
  if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
  loadTree();
}

// --- Songs (flat, paginated) ---

async function loadSongsPage() {
  const status = document.getElementById('status-filter').value;
  const search = document.getElementById('search-box').value;
  const params = new URLSearchParams({ page: currentPage, page_size: pageSize });
  if (status) params.set('status', status);
  if (search) params.set('search', search);
  const res = await fetch('/api/tracks?' + params.toString());
  const data = await res.json();

  const container = document.getElementById('library-container');
  const emptyState = document.getElementById('empty-state');

  if (data.tracks.length === 0) {
    container.innerHTML = '';
    emptyState.style.display = 'block';
    document.getElementById('pagination').style.display = 'none';
    return;
  }
  emptyState.style.display = 'none';

  container.innerHTML = `
    <div class="table-scroll">
      <table>
        <thead><tr><th>Artist</th><th>Title</th><th>Album</th><th>Status</th><th></th></tr></thead>
        <tbody>${data.tracks.map(t => { cacheTrack(t); return `
          <tr>
            <td>${escapeHtml(t.artist || '—')}</td>
            <td>${escapeHtml(t.title || '—')}</td>
            <td>${escapeHtml(t.album || '—')}</td>
            <td><span class="badge ${t.status}">${t.status.replace('_', ' ')}</span></td>
            <td style="display:flex;gap:6px;justify-content:flex-end">
              ${actionButtonsHtml(t)}
              <button class="delete-btn" onclick="deleteTrack(${t.id}, event)" title="Remove this track from Lyricdarr">&#9167;</button>
            </td>
          </tr>
        `; }).join('')}</tbody>
      </table>
    </div>
  `;

  renderPagination(data);
}

function renderPagination(data) {
  const el = document.getElementById('pagination');
  if (data.total_pages <= 1) { el.style.display = 'none'; return; }
  el.style.display = 'flex';

  const p = data.page;
  const tp = data.total_pages;
  let pages = new Set([1, tp, p - 1, p, p + 1]);
  pages = [...pages].filter(n => n >= 1 && n <= tp).sort((a, b) => a - b);

  let html = `<button ${p <= 1 ? 'disabled' : ''} onclick="goToPage(${p - 1})">&laquo; Prev</button>`;
  let prevPage = 0;
  for (const n of pages) {
    if (prevPage && n - prevPage > 1) html += `<span class="page-info">…</span>`;
    html += `<button class="${n === p ? 'active' : ''}" onclick="goToPage(${n})">${n}</button>`;
    prevPage = n;
  }
  html += `<button ${p >= tp ? 'disabled' : ''} onclick="goToPage(${p + 1})">Next &raquo;</button>`;
  html += `<span class="page-info">${data.total} tracks</span>`;
  el.innerHTML = html;
}

function goToPage(n) {
  currentPage = n;
  loadSongsPage();
}

async function retryTrack(id, evt) {
  if (evt) evt.stopPropagation();
  await fetch(`/api/tracks/${id}/retry`, { method: 'POST' });
  loadLibrary();
  loadStats();
}

async function deleteTrack(id, evt) {
  if (evt) evt.stopPropagation();
  if (!confirm('Remove this track from Lyricdarr? This only untracks it — no files are deleted.')) return;
  await fetch(`/api/tracks/${id}`, { method: 'DELETE' });
  loadLibrary();
  loadStats();
}

async function deleteAlbum(artist, album, evt) {
  if (evt) evt.stopPropagation();
  if (!confirm(`Remove the album "${album}" (${artist}) from Lyricdarr? This only untracks it — no files are deleted.`)) return;
  const params = new URLSearchParams({ artist, album });
  await fetch(`/api/library/album?${params.toString()}`, { method: 'DELETE' });
  loadLibrary();
  loadStats();
}

async function deleteArtist(artist, evt) {
  if (evt) evt.stopPropagation();
  if (!confirm(`Remove all tracks by "${artist}" from Lyricdarr? This only untracks them — no files are deleted.`)) return;
  const params = new URLSearchParams({ artist });
  await fetch(`/api/library/artist?${params.toString()}`, { method: 'DELETE' });
  loadLibrary();
  loadStats();
}

// --- Background jobs + real-time progress (SSE) ---

const PHASE_LABELS = {
  scan: 'Refreshing library',
  fetch: 'Downloading missing lyrics',
  scan_and_fetch: 'Scanning & downloading lyrics',
  verify: 'Verifying LRC files on disk',
};

function setButtonsDisabled(disabled) {
  ['scan-btn', 'verify-btn', 'fetch-btn'].forEach(id => {
    document.getElementById(id).disabled = disabled;
  });
}

async function startJob(url) {
  const res = await fetch(url, { method: 'POST' });
  if (res.status === 409) {
    document.getElementById('progress-msg').textContent = 'A job is already running — please wait.';
    return;
  }
}

function summarize(phase, extra) {
  if (!extra) return '';
  if (phase === 'scan') {
    const removed = extra.removed_tracks ? `, ${extra.removed_tracks} removed (no longer on disk)` : '';
    return `Scan complete — ${extra.scanned_files} files scanned, ${extra.new_tracks} new tracks added${removed}.`;
  }
  if (phase === 'fetch') {
    return `Done — found: ${(extra.found || 0) + (extra.found_unsynced || 0)}, not found: ${extra.not_found}, instrumental: ${extra.instrumental}, errors: ${extra.error}.`;
  }
  if (phase === 'scan_and_fetch') {
    const f = extra.fetch || {};
    const s = extra.scan || {};
    const removed = s.removed_tracks ? `, ${s.removed_tracks} removed` : '';
    return `Done — ${s.scanned_files} files scanned, ${s.new_tracks} new${removed}; found: ${(f.found || 0) + (f.found_unsynced || 0)}, not found: ${f.not_found}.`;
  }
  if (phase === 'verify') {
    return `Verify complete — now found: ${extra.now_found}, now missing: ${extra.now_missing}, unchanged: ${extra.unchanged}.`;
  }
  return 'Done.';
}

let lastRunning = false;

function applyProgress(state) {
  const msg = document.getElementById('progress-msg');
  const track = document.getElementById('progress-track');
  const fill = document.getElementById('progress-fill');

  jobRunning = state.running;
  setButtonsDisabled(state.running);

  if (state.running) {
    track.classList.add('active');
    const label = PHASE_LABELS[state.phase] || state.phase;
    if (state.total > 0) {
      const pct = Math.min(100, Math.round((state.processed / state.total) * 100));
      fill.classList.remove('indeterminate');
      fill.style.width = pct + '%';
      msg.textContent = `${label}… ${state.processed}/${state.total}${state.current ? ' — ' + state.current : ''}`;
    } else {
      fill.classList.add('indeterminate');
      msg.textContent = `${label}…${state.current ? ' — ' + state.current : ''}`;
    }
    msg.className = 'progress-msg running';
  } else {
    track.classList.remove('active');
    fill.classList.remove('indeterminate');
    fill.style.width = '0%';
    if (state.error) {
      msg.textContent = `Error: ${state.error}`;
      msg.className = 'progress-msg err';
    } else if (state.extra && Object.keys(state.extra).length) {
      msg.textContent = summarize(state.phase, state.extra);
      msg.className = 'progress-msg ok';
    } else {
      msg.textContent = '';
      msg.className = 'progress-msg';
    }
  }

  // A job just finished — refresh the view.
  if (lastRunning && !state.running) {
    loadStats();
    loadLibrary();
  }
  lastRunning = state.running;
}

function connectProgressStream() {
  const es = new EventSource('/api/progress/stream');
  es.onmessage = (evt) => applyProgress(JSON.parse(evt.data));
  es.onerror = () => {
    // Browser auto-reconnects EventSource; nothing else to do here.
  };
}

// --- Settings ---

async function openSettings() {
  const res = await fetch('/api/settings');
  const data = await res.json();
  document.getElementById('settings-music-dir').value = data.music_dir;
  document.getElementById('settings-interval').value = data.scan_interval_hours;
  document.getElementById('settings-auto-scan').checked = data.auto_scan_enabled;
  document.getElementById('settings-netease').checked = data.netease_fallback_enabled;
  document.getElementById('settings-webhook-hint').innerHTML = data.webhook_configured
    ? '<label style="text-transform:none;font-size:12px;color:var(--text-dim)">Lidarr webhook token is set via WEBHOOK_TOKEN.</label>'
    : '<label style="text-transform:none;font-size:12px;color:var(--text-dim)">Lidarr webhook: POST /api/webhook/lidarr (no token required — set WEBHOOK_TOKEN env var to require one).</label>';
  document.getElementById('settings-overlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
}

async function saveSettings() {
  const interval = parseFloat(document.getElementById('settings-interval').value);
  const autoScan = document.getElementById('settings-auto-scan').checked;
  const netease = document.getElementById('settings-netease').checked;
  await fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      scan_interval_hours: interval,
      auto_scan_enabled: autoScan,
      netease_fallback_enabled: netease,
    }),
  });
  closeSettings();
}

document.getElementById('settings-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'settings-overlay') closeSettings();
});

// --- Lyrics review/preview ---

const SOURCE_LABELS = {
  lrclib_fuzzy: 'Matched via LRCLIB fuzzy search (not an exact hit) — check it lines up with the track.',
  netease_fuzzy: 'Matched via NetEase fuzzy search (not an exact hit) — check it lines up with the track.',
};

let previewTrackId = null;

function openPreview(id, evt) {
  if (evt) evt.stopPropagation();
  const t = trackCache[id];
  if (!t) return;
  previewTrackId = id;
  document.getElementById('preview-title').textContent = `${t.artist || 'Unknown Artist'} — ${t.title || ''}`;
  document.getElementById('preview-source').textContent = SOURCE_LABELS[t.match_source] || '';
  document.getElementById('preview-lyrics').textContent =
    t.pending_synced || t.pending_plain || '(no lyrics text available)';
  document.getElementById('preview-overlay').classList.add('open');
}

function closePreview() {
  document.getElementById('preview-overlay').classList.remove('open');
  previewTrackId = null;
}

async function approvePending() {
  if (previewTrackId == null) return;
  await fetch(`/api/tracks/${previewTrackId}/approve`, { method: 'POST' });
  closePreview();
  loadLibrary();
  loadStats();
}

async function rejectPending() {
  if (previewTrackId == null) return;
  if (!confirm('Discard this candidate? The track goes back to not-found and can be retried later.')) return;
  await fetch(`/api/tracks/${previewTrackId}/reject`, { method: 'POST' });
  closePreview();
  loadLibrary();
  loadStats();
}

document.getElementById('preview-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'preview-overlay') closePreview();
});

// --- Init ---

document.getElementById('status-filter').style.display = 'none';
loadStats();
loadLibrary();
connectProgressStream();
setInterval(loadStats, 15000);
</script>
